[workspace]
resolver = "3"
members = [
    "crates/*"
]

[workspace.dependencies]
sha2 = { version = "0.10.9", default-features = false }

# Used by demo crates
honeybadger = { path = "crates/honeybadger" }
frost-secp256k1 = { version = "2.2.0", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false, features = ["std"] } # 0.3.1 needed due to frost-secp256k1 dependency constraints
rand_core = { version = "0.6.4", default-features = false, features = ["getrandom"] } # 0.6.4 needed due to frost-secp256k1 dependency constraints
ctor = "0.6.0"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["env-filter", "fmt", "json", "time", "ansi"] }
